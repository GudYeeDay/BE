reviews:
  review_status: true
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  path_filters:
    - "!gradlew"
    - "!gradlew.bat"
    - "!gradle/**"
    - "!build.gradle"
    - "!settings.gradle"
    - "!*.lock"
    - "!.github/**"
    - "!.gitignore"
    - "!.gitattributes"
    - "!src/main/resources/static/**"
    - "!Dockerfile"
    - "!docker-compose*.yml"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
