spring:
  application:
    name: GudYeeDay

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB # 프로젝트 장표 최대 10MB*10장 첨부 가능

  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
    auth-code-expiration-millis: 300000

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

apple:
  oauth:
    # 애플 identity token의 aud 값. iOS 앱은 번들 ID, 웹/안드로이드는 Services ID (여러 개면 쉼표로 구분)
    client-ids: ${APPLE_CLIENT_IDS:}


app:
  s3:
    bucket: ${BUCKET_NAME}
    region: ap-northeast-2
    root-prefix: profile-images
    cloudfront-domain: ""
    presign-seconds: 3600

notification:
  daily-mission:
    # 오늘의 굳이 알림 생성 시각 (KST, 초 분 시 일 월 요일) - 전체 사용자 대상
    cron: ${DAILY_MISSION_CRON:0 0 9 * * *}
  mission-reminder:
    # 진행중인 미션 리마인드 알림 생성 시각 (KST, 초 분 시 일 월 요일)
    cron: ${MISSION_REMINDER_CRON:0 0 20 * * *}

logging:
  level:
    org.springframework.web: DEBUG

fcm:
  # true일 때만 실제 폰으로 푸시를 보냄 (false면 발송 대상만 로그로 남김)
  enabled: ${FCM_ENABLED:false}
  # Firebase 서비스 계정 키: 파일 경로 또는 JSON 전체를 base64 인코딩한 값 중 하나만 설정
#  credentials-path: ${FCM_CREDENTIALS_PATH:}
  credentials-base64: ${FCM_CREDENTIALS_BASE64:}

admin:
  # 관리자 API 호출 시 X-Admin-Key 헤더로 보낼 키 (비어 있으면 관리자 API는 항상 403)
  api-key: ${ADMIN_API_KEY:}